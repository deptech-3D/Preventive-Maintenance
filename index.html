<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="theme-color" content="#043580" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Preventive Maintenance</title>
    <meta name="description" content="Aplikasi Preventive Maintenance Perawatan AC Rutin Berjadwal dan Utilitas Hotel." />
    <script>
      // Suppress benign Vite WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var msg = String(event.reason.message || event.reason);
          if (msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
          }
        }
      });
      (function() {
        var CURRENT_VERSION = "2026-10-04-v6-controller-fix";
        var savedVersion = localStorage.getItem("pm_app_build_version");
        if (savedVersion !== CURRENT_VERSION) {
          localStorage.setItem("pm_app_build_version", CURRENT_VERSION);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
